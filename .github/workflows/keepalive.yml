name: Keep HF Space Alive

on:
  schedule:
    - cron: "22 14 * * *"   # 19:52 IST daily (IST = UTC + 5:30)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint
        run: |
          curl -sf --retry 3 --retry-delay 10 \
            "https://vrajesh-sharma.onrender.com/health" \
            && echo "Ping successful" \
            || echo "Ping failed"